<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Infographic và Video</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .media-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .item {
      flex: 1;
      min-width: 300px;
    }

    img,
    video {
      width: 100%;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <h1>Infographic và Video MP4</h1>
  <div class="media-container">
    <!-- Hiển thị Infographic -->
    <div class="item">
      <h2>Infographic</h2>
      <img src="infographic.jpg" alt="Infographic">
    </div>

    <!-- Hiển thị Video MP4 -->
    <div class="item">
      <h2>Video MP4</h2>
      <video controls preload="metadata">
        <source src="Nhiemvu2.2.mp4" type="video/mp4">
        Trình duyệt không hỗ trợ thẻ video.
      </video>
    </div>
  </div>
</body>

</html>
